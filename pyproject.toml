[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tridots_chatbot"
version = "0.2.0"
description = "RAG chatbot widget for Tridots Tech — Frappe app"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.5.1",
    "httpx>=0.28.1",
    "numpy<2",
    "onnxruntime<1.20.0",
    "pydantic>=2.11.0",
]

[project.scripts]
tridots-chatbot = "tridots_chatbot.utils.cli:main"

[tool.setuptools]
packages = ["tridots_chatbot"]

[tool.setuptools.package-dir]
tridots_chatbot = "tridots_chatbot"
